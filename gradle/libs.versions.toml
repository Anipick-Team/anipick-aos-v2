[versions]
# Android/Kotlin 빌드 도구
agp = "9.3.0"
androidTools = "32.3.0"
kotlin = "2.4.10"
jetbrainsKotlinJvm = "2.4.10"
ksp = "2.3.9"
desugarJdkLibs = "2.1.5"

# AndroidX 기본 / UI 코어
coreKtx = "1.19.0"
coreSplashscreen = "1.2.0"
appcompat = "1.7.1"
exifinterface = "1.4.2"

# Jetpack Compose
composeBom = "2026.06.01"
activityCompose = "1.13.0"
uiComposeMaterial3 = "0.10.0"
material = "1.14.0"

# Navigation
navigation3Runtime = "1.1.4"
material3AdaptiveNav3 = "1.3.0-rc01"
lifecycleViewmodelNav3 = "2.11.0"

# 아키텍쳐 / 생명주기
lifecycleRuntimeKtx = "2.11.0"

# 로컬 DB
room = "2.8.4"

# 로컬 저장소
datastore = "1.2.1"

# DI (의존성 주입)
koin = "4.2.2"

# 네트워킹 (Ktor)
ktorClientAuth = "3.5.1"
ktorClientCio = "3.5.1"
ktorClientContentNegotiation = "3.5.1"
ktorClientCore = "3.5.1"
ktorClientLogging = "3.5.1"
ktorSerializationKotlinxJson = "3.5.1"

# 직렬화 (Kotlinx Serialization)
kotlinxSerializationCore = "1.11.0"
kotlinxSerializationJson = "1.11.0"

# 코루틴 (Coroutines)
kotlinxCoroutinesAndroid = "1.11.0"
kotlinxCoroutinesCore = "1.11.0"

# 이미지 로딩 (Coil)
coilCompose = "3.5.0"

# 로그인 / 인증
credentials = "1.6.0"
googleid = "1.2.0"
kakaoUser = "2.24.0"

# 앱 업데이트
appUpdate = "2.1.0"

# 로깅
timber = "5.0.1"

# 테스트
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
mockk = "1.14.11"
kotlinxCoroutinesTest = "1.11.0"
turbine = "1.2.1"

# Project versions
projectApplicationId = "com.jparkbro.anipick"
projectVersionCode = "57"
projectVersionName = "1.2.7"
projectMinSdkVersion = "28"
projectTargetSdkVersion = "37"
projectCompileSdkVersion = "37"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
material = { module = "com.google.android.material:material", version.ref = "material" }

# 테스트
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "junitVersion" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs"}
ui-compose-material3 = { module = "io.github.droibit.oss-licenses-android:ui-compose-material3", version.ref = "uiComposeMaterial3" }

# 생명주기
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }

# Navigation
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3Runtime" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3Runtime" }
androidx-material3-adaptive-navigation3 = { module = "androidx.compose.material3.adaptive:adaptive-navigation3", version.ref = "material3AdaptiveNav3" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }

# 로컬 DB
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# 로컬 저장소
androidx-datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# DI (의존성 주입)
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-navigation3 = { module = "io.insert-koin:koin-compose-navigation3", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# 이미지 로딩 (Coil)
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coilCompose" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coilCompose" }

# 로그인 / 인증
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
kakao-user = { module = "com.kakao.sdk:v2-user", version.ref = "kakaoUser" }

# 앱 업데이트
app-update = { module = "com.google.android.play:app-update", version.ref = "appUpdate" }
app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "appUpdate" }

# 로깅
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# 네트워킹 (Ktor)
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktorClientAuth" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktorClientCio" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktorClientContentNegotiation" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktorClientCore" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktorClientLogging" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktorSerializationKotlinxJson" }

# 직렬화 (Kotlinx Serialization)
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerializationCore" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# 코루틴 (Coroutines)
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }

# Gradle (build-logic convention plugin 의존성)
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
android-tools-common = { module = "com.android.tools:common", version.ref = "androidTools" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
room-gradlePlugin = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "jetbrainsKotlinJvm" }
room = { id = "androidx.room", version.ref = "room" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

anipick-android-application = { id = "anipick.android.application", version = "unspecified" }
anipick-android-application-compose = { id = "anipick.android.application.compose", version = "unspecified" }
anipick-android-library = { id = "anipick.android.library", version = "unspecified" }
anipick-android-library-compose = { id = "anipick.android.library.compose", version = "unspecified" }
anipick-android-feature-api = { id = "anipick.android.feature.api", version = "unspecified" }
anipick-android-feature-impl = { id = "anipick.android.feature.impl", version = "unspecified" }
anipick-android-room = { id = "anipick.android.room", version = "unspecified" }
anipick-jvm-library = { id = "anipick.jvm.library", version = "unspecified" }
anipick-jvm-ktor = { id = "anipick.jvm.ktor", version = "unspecified" }

[bundles]
compose = [
    "androidx-activity-compose",
    "androidx-compose-material3",
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
]
compose-debug = [
    "androidx-compose-ui-tooling",
    "androidx-compose-ui-test-manifest",
]
koin = [
    "koin-core",
    "koin-android",
]
koin-compose = [
    "koin-core",
    "koin-android",
    "koin-compose",
    "koin-compose-navigation3",
    "koin-compose-viewmodel",
]
ktor = [
    "ktor-client-auth",
    "ktor-client-cio",
    "ktor-client-content-negotiation",
    "ktor-client-core",
    "ktor-client-logging",
    "ktor-serialization-kotlinx-json",
]
navigation3 = [
    "androidx-navigation3-runtime",
    "androidx-navigation3-ui",
    "androidx-lifecycle-viewmodel-navigation3",
    "androidx-material3-adaptive-navigation3",
]
coil = [
    "coil-compose",
    "coil-network-okhttp",
]
room = [
    "androidx-room-runtime",
    "androidx-room-ktx",
]
test = [
    "mockk",
    "kotlinx-coroutines-test",
    "turbine",
]